name: Android build, tests and reproducible debug release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Hosted runner already includes the Android command-line tools.\n      # Avoid setup-android@v3 on newer runners (it tries removed 'tools' package).\n      - name: Install Android SDK packages\n        run: |\n          echo \"ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}\" >> \"$GITHUB_ENV\"\n          yes | \"${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager\" --licenses >/dev/null || true\n          \"${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager\" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend && PYTHONPATH=. pytest -q
      - name: Assemble release provenance
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NoteFlow-AI-v1.0.0-debug.apk
          git archive --format=zip --output=out/NoteFlow-AI-v1.0.0-source.zip HEAD
          sha256sum out/*.apk out/*.zip > out/SHA256SUMS.txt
          echo "COMMIT=$(git rev-parse HEAD)" > out/BUILD_INFO.txt
          echo "SIGNING=Android debug signing key; NOT production signed" >> out/BUILD_INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/NoteFlow-AI-v1.0.0-debug.apk > out/APK_SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-AI-v1.0.0-${{ github.sha }}
          path: out/*
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
